# ===== Application =====
spring.application.name=bank-loan-management-system
server.port=8080

# ===== H2 in-memory DB (default, zero setup - good for running/testing locally) =====
spring.datasource.url=jdbc:h2:mem:bankloandb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== To use MySQL instead, comment the H2 block above and uncomment below =====
# spring.datasource.url=jdbc:mysql://localhost:3306/bankloandb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===== Validation error messages =====
server.error.include-message=always
